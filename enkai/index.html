<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宴会の仕込み量・発注締切 計算</title>
<style>
:root{
  --bg:#faf7f2; --card:#fff; --ink:#2b2b2b; --sub:#6b6b6b;
  --accent:#b5452a; --accent-soft:#f6e3dc; --line:#e6e0d6;
  --warn:#a33; --ok:#2f6b3a;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:16px; line-height:1.6;
}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px}
.lead{color:var(--sub);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:1.02rem;margin:0 0 12px;color:var(--accent)}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.name{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;min-width:0;width:100%;accent-color:var(--accent)}
input[type=number],input[type=datetime-local]{
  font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:inherit;width:100%;
}
.num{width:110px;flex:0 0 110px}
.unit{color:var(--sub);white-space:nowrap;min-width:3em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none;margin:0}
.opt label{
  display:block;border:2px solid var(--line);border-radius:12px;padding:12px 6px;
  text-align:center;cursor:pointer;background:#fff;user-select:none;font-weight:600;
}
.opt small{display:block;color:var(--sub);font-size:.76rem;font-weight:400;line-height:1.3}
.opt input:checked + label{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.opt input:focus-visible + label{outline:3px solid #f0a58f;outline-offset:2px}
.hint{color:var(--sub);font-size:.85rem;margin:6px 0 0}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.chip{background:var(--accent-soft);border-radius:12px;padding:10px 12px;min-width:0}
.chip b{display:block;font-size:.8rem;color:var(--sub);font-weight:400}
.chip span{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.chip.late{background:#f7d9d9}
.chip.late span{color:var(--warn)}
.item{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.item:first-child{border-top:0;padding-top:0}
.nm{font-weight:700}
.cat{color:var(--sub);font-size:.8rem;font-weight:400;margin-left:6px}
.qty{font-weight:700;font-size:1.15rem;text-align:right;white-space:nowrap}
.sub{grid-column:1/-1;color:var(--sub);font-size:.85rem;display:flex;flex-wrap:wrap;gap:2px 14px}
.sub .late-t{color:var(--warn);font-weight:700}
button{
  font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;
  border-radius:12px;padding:12px 16px;width:100%;cursor:pointer;margin-top:12px;
}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #f0a58f;outline-offset:2px}
button.sec{background:#fff;color:var(--accent);border:2px solid var(--accent)}
#msg{min-height:1.4em;font-size:.9rem;color:var(--ok);margin:8px 0 0;text-align:center}
.notice{font-size:.8rem;color:var(--sub);margin:14px 4px 0}
@media (min-width:560px){
  .item{grid-template-columns:1fr auto}
}
@media (max-width:360px){
  .summary{grid-template-columns:1fr}
  .seg{gap:6px}
}
</style>
</head>
<body>
<main>
  <h1>宴会の仕込み量・発注締切</h1>
  <p class="lead">人数とコースを選ぶと、食材ごとの仕込み量と卸への発注締切が分かります。</p>

  <section class="card">
    <h2>1. 条件を入れる</h2>

    <div class="field">
      <label class="name" for="people">人数</label>
      <div class="row">
        <input type="range" id="range" min="1" max="100" value="20" aria-label="人数（スライダー）">
        <input type="number" id="people" class="num" min="1" max="300" value="20" inputmode="numeric" aria-label="人数">
        <span class="unit">名</span>
      </div>
    </div>

    <div class="field">
      <span class="name" id="courseLabel">コース</span>
      <div class="seg" role="radiogroup" aria-labelledby="courseLabel">
        <div class="opt"><input type="radio" name="course" id="c-ume" value="ume"><label for="c-ume">梅<small>鶏・野菜中心</small></label></div>
        <div class="opt"><input type="radio" name="course" id="c-take" value="take" checked><label for="c-take">竹<small>鯛・鶏・海老</small></label></div>
        <div class="opt"><input type="radio" name="course" id="c-matsu" value="matsu"><label for="c-matsu">松<small>鯛・和牛・海老</small></label></div>
      </div>
    </div>

    <div class="field">
      <label class="name" for="buffer">予備の量（ロス・追加分）</label>
      <div class="row">
        <input type="range" id="buffer" min="0" max="20" step="1" value="5">
        <span class="unit" id="bufVal">5%</span>
      </div>
    </div>

    <div class="field">
      <label class="name" for="eventAt">宴会の日時</label>
      <input type="datetime-local" id="eventAt">
      <p class="hint">日時を入れると、発注の締切が出ます。</p>
    </div>
  </section>

  <section class="card" aria-live="polite">
    <h2>2. 結果</h2>
    <div class="summary">
      <div class="chip"><b>人数・コース</b><span id="sumPeople"></span></div>
      <div class="chip" id="deadlineChip"><b>発注締切（最も早いもの）</b><span id="sumDeadline"></span></div>
    </div>
    <div id="list"></div>
    <button class="sec" id="copy" type="button">発注メモをコピー</button>
    <p id="msg" role="status"></p>
  </section>

  <p class="notice">※ 数値はサンプルです。一人前の量・歩留まり・卸の締切時刻は、店の実績に合わせて下のスクリプト内の ITEMS を書き換えてください。</p>
</main>

<script>
// ===== 店に合わせて書き換える場所 =====
// per: 一人前の可食量(g)。yield: 歩留まり（仕込み後に残る割合）。
// lead: 何日前に入荷が必要か。cutoff: 卸への発注締切の時刻（HH:MM）。
const COURSES = {ume:'梅', take:'竹', matsu:'松'};
const ITEMS = [
  {name:'鯛（お造り用）',   cat:'鮮魚',   yield:0.6,  lead:1, cutoff:'10:00', per:{ume:0,  take:40,  matsu:60}},
  {name:'海老（天ぷら用）', cat:'鮮魚',   yield:0.8,  lead:1, cutoff:'10:00', per:{ume:0,  take:30,  matsu:50}},
  {name:'鶏もも肉',         cat:'精肉',   yield:0.8,  lead:2, cutoff:'15:00', per:{ume:90, take:60,  matsu:0}},
  {name:'和牛ロース',       cat:'精肉',   yield:0.9,  lead:2, cutoff:'15:00', per:{ume:0,  take:0,   matsu:120}},
  {name:'旬野菜',           cat:'青果',   yield:0.85, lead:1, cutoff:'14:00', per:{ume:80, take:100, matsu:120}},
  {name:'米（ご飯用）',     cat:'乾物・米', yield:1,   lead:3, cutoff:'15:00', per:{ume:100,take:100, matsu:100}}
];
// ======================================

const DAYS = ['日','月','火','水','木','金','土'];
const $ = id => document.getElementById(id);

function getPeople(){
  const n = parseInt($('people').value, 10);
  if (!Number.isFinite(n) || n < 1) return 1;
  return Math.min(n, 300);
}
function getCourse(){
  return document.querySelector('input[name="course"]:checked').value;
}
function getEvent(){
  if (!$('eventAt').value) return null;
  const d = new Date($('eventAt').value);
  return isNaN(d) ? null : d;
}
function fmtG(g){
  if (g < 1000) return g.toLocaleString('ja-JP') + ' g';
  const kg = g / 1000;
  return (Number.isInteger(kg) ? kg : Math.round(kg * 100) / 100) + ' kg';
}
function pad(n){ return String(n).padStart(2, '0'); }
function fmtDate(d){
  return `${d.getMonth()+1}/${d.getDate()}（${DAYS[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// 宴会日の何日前・何時が締切か
function deadlineFor(item, ev){
  const d = new Date(ev.getFullYear(), ev.getMonth(), ev.getDate());
  d.setDate(d.getDate() - item.lead);
  const [h, m] = item.cutoff.split(':').map(Number);
  d.setHours(h, m, 0, 0);
  return d;
}

function compute(){
  const people = getPeople();
  const course = getCourse();
  const buf = Number($('buffer').value) / 100;
  const ev = getEvent();
  const rows = ITEMS.map(it => {
    const edible = it.per[course] * people;          // 可食量
    if (!edible) return null;
    const raw = Math.ceil(edible / it.yield * (1 + buf) / 10) * 10; // 仕込み量（原料・10g単位）
    return {it, edible, raw, dl: ev ? deadlineFor(it, ev) : null};
  }).filter(Boolean);
  return {people, course, buf, ev, rows};
}

function render(){
  const {people, course, buf, ev, rows} = compute();
  const now = new Date();
  $('bufVal').textContent = Math.round(buf * 100) + '%';
  $('sumPeople').textContent = `${people}名 ・ ${COURSES[course]}コース`;

  const chip = $('deadlineChip');
  if (!ev || !rows.length) {
    $('sumDeadline').textContent = '日時を入れてください';
    chip.classList.remove('late');
  } else {
    const earliest = rows.reduce((a, r) => (a === null || r.dl < a ? r.dl : a), null);
    const past = earliest < now;
    $('sumDeadline').textContent = fmtDate(earliest) + (past ? '（過ぎています）' : '');
    chip.classList.toggle('late', past);
  }

  $('list').innerHTML = rows.map(r => {
    const late = r.dl && r.dl < now;
    return `<div class="item">
      <div><span class="nm">${r.it.name}</span><span class="cat">${r.it.cat}</span></div>
      <div class="qty">${fmtG(r.raw)}</div>
      <div class="sub">
        <span>可食量 ${fmtG(r.edible)}</span>
        <span>歩留まり ${Math.round(r.it.yield * 100)}%</span>
        ${r.dl ? `<span class="${late ? 'late-t' : ''}">発注締切 ${fmtDate(r.dl)}${late ? '（過ぎています）' : ''}</span>` : '<span>日時を入れると締切が出ます</span>'}
      </div>
    </div>`;
  }).join('');
}

function memoText(){
  const {people, course, buf, ev, rows} = compute();
  const lines = [`【発注メモ】${people}名 ${COURSES[course]}コース（予備 ${Math.round(buf * 100)}%）`];
  if (ev) lines.push(`宴会日時: ${fmtDate(ev)}`);
  rows.forEach(r => {
    lines.push(`・${r.it.name}: ${fmtG(r.raw)}${r.dl ? `（締切 ${fmtDate(r.dl)}）` : ''}`);
  });
  return lines.join('\n');
}

// 入力の連動
$('range').addEventListener('input', () => { $('people').value = $('range').value; render(); });
$('people').addEventListener('input', () => {
  const n = parseInt($('people').value, 10);
  if (Number.isFinite(n)) $('range').value = Math.min(Math.max(n, 1), 100);
  render();
});
$('people').addEventListener('change', () => { $('people').value = getPeople(); render(); });
$('buffer').addEventListener('input', render);
$('eventAt').addEventListener('input', render);
$('eventAt').addEventListener('change', render);
document.querySelectorAll('input[name="course"]').forEach(el => el.addEventListener('change', render));

$('copy').addEventListener('click', async () => {
  let ok = false;
  try {
    await navigator.clipboard.writeText(memoText());
    ok = true;
  } catch (e) {
    ok = false;
  }
  $('msg').textContent = ok ? 'コピーしました。' : 'コピーできませんでした。画面の内容を手で控えてください。';
  clearTimeout(window._msgTimer);
  window._msgTimer = setTimeout(() => { $('msg').textContent = ''; }, 3000);
});

render();
</script>
</body>
</html>
