<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務タスク・週報</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#222;--sub:#6b6b6b;--accent:#2f5d8a;--accent-soft:#e3edf7;--line:#dde1e7;--warn:#b33}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 2px}
h2{font-size:1rem;margin:0 0 10px;color:var(--accent)}
.lead{color:var(--sub);font-size:.9rem;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{border-color:transparent;color:var(--sub);background:none;padding:4px 8px}
button.danger{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit;max-width:100%}
textarea{width:100%;min-height:70px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:140px}
.num{width:90px}
.muted{color:var(--sub);font-size:.85rem}
.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.item.done .ttl{text-decoration:line-through;color:var(--sub)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:.9rem}
.meta select,.meta input{font-size:.9rem;padding:4px 6px}
.chip{background:var(--accent-soft);border-radius:10px;padding:6px 8px;margin-bottom:6px}
.chip.done{opacity:.55}
.chip label{display:flex;gap:6px;align-items:flex-start}
.chip select{margin-top:4px;width:100%}
.wrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:680px;background:#fff}
table.grid th,table.grid td{border:1px solid var(--line);vertical-align:top;padding:6px;width:18%}
table.grid th{background:#f0f2f5;font-weight:600;font-size:.9rem}
table.grid th:first-child{width:11%}
table.grid td.over{background:#fbe9e9}
.sum{font-size:.8rem;color:var(--sub);text-align:right;margin-top:4px}
pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.88rem;margin:0}
.half{margin:18px 0 6px;color:var(--ink);font-size:1.05rem}
@media (max-width:600px){main{padding:12px}}
</style>
</head>
<body>
<main>
  <h1>業務タスク・週報</h1>
  <p class="lead">MBO・マイルストーン・Todo を管理し、週報にまとめます（自分用）</p>

  <div class="bar" style="margin-bottom:14px">
    <nav class="tabs grow">
      <button data-tab="week">今週</button>
      <button data-tab="todo">Todo</button>
      <button data-tab="mbo">MBO</button>
      <button data-tab="report">週報</button>
    </nav>
    <button data-act="export">書き出し</button>
    <button data-act="import">読み込み</button>
    <input type="file" id="imp" accept="application/json" hidden>
  </div>

  <section data-view="week" id="v-week"></section>
  <section data-view="todo" id="v-todo" hidden></section>
  <section data-view="mbo" id="v-mbo" hidden></section>
  <section data-view="report" id="v-report" hidden></section>
</main>

<script>
const KEY = 'taskWeeklyV1';
const CAP = 180;                       // 午前・午後それぞれの作業目安（分）
const ESTS = [15,30,45,60,75,90,105,120,150,180,240,300,360,480];
const MS_STATUS = ['未着手','進行中','達成','遅延'];
const REASONS = ['時間不足','見積ミス','優先度変更','割り込み','依存待ち','その他'];

/* ---------- 日付・文字列ユーティリティ ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const monday = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); };
const today = () => ymd(new Date());
const DOW = ['日','月','火','水','木','金','土'];
const dlabel = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const fmtMin = m => { m = Number(m)||0; const h = Math.floor(m/60), r = m%60; return h&&r ? `${h}時間${r}分` : h ? `${h}時間` : `${r}分`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const curHalf = () => { const d = new Date(), y = d.getFullYear(), m = d.getMonth()+1;
  return m>=4 && m<=9 ? `${y}上期` : `${m<4 ? y-1 : y}下期`; };
const inR = (d,a,b) => !!d && d>=a && d<=b;
const slotsOf = ws => { const a = []; for (let i=0;i<5;i++){ const d = addDays(ws,i); a.push(d+'|AM', d+'|PM'); } return a; };
const slotLabel = k => { const [d,p] = k.split('|'); return `${dlabel(d)} ${p==='AM'?'午前':'午後'}`; };
const dayOf = t => t.slot ? t.slot.split('|')[0] : '';

/* ---------- 状態の読み書き（ブラウザ保存） ---------- */
const blank = () => ({ mbos:[], milestones:[], todos:[], reports:{} });
let S = blank();
const UI = { tab:'week', week: monday(today()), filter:'open' };
function load(){ try { const raw = localStorage.getItem(KEY); S = raw ? { ...blank(), ...JSON.parse(raw) } : blank(); } catch(e){ S = blank(); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ alert('保存できませんでした。ブラウザの容量や設定を確認してください。'); } }

const msById = id => S.milestones.find(m => m.id === id);
const msName = id => msById(id)?.title ?? '';

/* ---------- 共通パーツ ---------- */
function msOptions(sel){
  return `<option value="">（なし）</option>` + S.milestones.map(m =>
    `<option value="${m.id}"${m.id===sel?' selected':''}>${esc(m.title)}</option>`).join('');
}
function estOptions(sel){
  return ESTS.map(m => `<option value="${m}"${m===sel?' selected':''}>${fmtMin(m)}</option>`).join('');
}
function slotSelect(t, slots){
  const list = [...slots];
  if (t.slot && !list.includes(t.slot)) list.push(t.slot);
  return `<select data-chg="slot" data-id="${t.id}">
    <option value="">未割当</option>
    ${list.map(k => `<option value="${k}"${k===t.slot?' selected':''}>${slotLabel(k)}</option>`).join('')}
  </select>`;
}

/* ---------- 今週（午前・午後の割り振り） ---------- */
function todoChip(t, slots){
  return `<div class="chip${t.done?' done':''}">
    <label><input type="checkbox" data-act="toggle" data-id="${t.id}"${t.done?' checked':''}>
      <span class="ttl">${esc(t.title)}</span></label>
    <div class="muted">${fmtMin(t.estMin)}${t.milestoneId ? ' · ' + esc(msName(t.milestoneId)) : ''}</div>
    ${slotSelect(t, slots)}
  </div>`;
}
function renderWeek(){
  const ws = UI.week, we = addDays(ws,4), slots = slotsOf(ws), set = new Set(slots);
  const pool = S.todos.filter(t => !t.done && !set.has(t.slot));
  const days = [0,1,2,3,4].map(i => addDays(ws,i));
  const head = `<tr><th></th>${days.map(d => `<th>${dlabel(d)}</th>`).join('')}</tr>`;
  const body = ['AM','PM'].map(p => `<tr><th>${p==='AM'?'午前':'午後'}</th>${days.map(d => {
      const k = d+'|'+p, ts = S.todos.filter(t => t.slot === k);
      const sum = ts.filter(t => !t.done).reduce((a,t) => a + (+t.estMin||0), 0);
      return `<td class="${sum>CAP?'over':''}">${ts.map(t => todoChip(t, slots)).join('')}
        <div class="sum">${fmtMin(sum)} / ${fmtMin(CAP)}</div></td>`;
    }).join('')}</tr>`).join('');

  document.getElementById('v-week').innerHTML = `
    <div class="card"><div class="hd">
      <div class="bar">
        <button data-act="wk" data-n="-7">◀ 前週</button>
        <button data-act="wk" data-n="0">今週</button>
        <button data-act="wk" data-n="7">次週 ▶</button>
      </div>
      <strong>${dlabel(ws)} 〜 ${dlabel(we)}</strong>
    </div></div>
    <div class="card"><h2>未割当・他の週のタスク（${pool.length}件）</h2>
      ${pool.length ? pool.map(t => todoChip(t, slots)).join('') : '<p class="muted">ありません</p>'}
    </div>
    <div class="card wrap"><table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <p class="muted">午前・午後それぞれ ${fmtMin(CAP)} を目安にしています。超えると赤くなります。</p>`;
}

/* ---------- Todo ---------- */
function renderTodo(){
  const f = UI.filter;
  const list = S.todos
    .filter(t => f==='all' || (f==='open' ? !t.done : t.done))
    .sort((a,b) => (a.done-b.done) || ((a.due||'9999') < (b.due||'9999') ? -1 : 1));
  const slots = slotsOf(UI.week);
  const row = t => `<div class="item${t.done?' done':''}">
    <div class="bar">
      <input type="checkbox" data-act="toggle" data-id="${t.id}"${t.done?' checked':''}>
      <input type="text" class="grow ttl" value="${esc(t.title)}" data-save="title" data-id="${t.id}">
      <button class="ghost danger" data-act="del" data-id="${t.id}">削除</button>
    </div>
    <div class="meta">
      <input type="text" placeholder="役割" value="${esc(t.role)}" data-save="role" data-id="${t.id}" style="width:8em">
      <select data-chg="ms" data-id="${t.id}">${msOptions(t.milestoneId)}</select>
      <select data-chg="est" data-id="${t.id}">${estOptions(t.estMin)}</select>
      <input type="date" value="${t.due||''}" data-save="due" data-id="${t.id}">
      ${slotSelect(t, slots)}
      ${t.done ? `<label>実績 <input type="number" class="num" step="15" min="0" value="${t.actualMin??''}" data-save="actual" data-id="${t.id}"> 分</label>` : ''}
    </div>
  </div>`;

  document.getElementById('v-todo').innerHTML = `
    <div class="card"><h2>タスクを追加</h2>
      <form data-form="todo" class="bar">
        <input type="text" name="title" class="grow" placeholder="タスク名（例：議題の整理）" required>
        <input type="text" name="role" placeholder="役割" style="width:8em">
        <select name="ms">${msOptions('')}</select>
        <select name="est">${estOptions(60)}</select>
        <input type="date" name="due">
        <button class="primary">追加</button>
      </form>
    </div>
    <div class="card">
      <div class="hd">
        <h2>一覧（${list.length}件）</h2>
        <select data-chg="filter">
          <option value="open"${f==='open'?' selected':''}>未完了</option>
          <option value="done"${f==='done'?' selected':''}>完了</option>
          <option value="all"${f==='all'?' selected':''}>すべて</option>
        </select>
      </div>
      ${list.length ? list.map(row).join('') : '<p class="muted">該当なし</p>'}
    </div>`;
}

/* ---------- MBO・マイルストーン ---------- */
function renderMbo(){
  const halves = [...new Set(S.mbos.map(m => m.half))].sort().reverse();
  const mboCard = m => {
    const ms = S.milestones.filter(x => x.mboId === m.id);
    return `<div class="card">
      <div class="hd">
        <input type="text" class="grow" value="${esc(m.objective)}" data-save="objective" data-kind="mbo" data-id="${m.id}">
        <button class="ghost danger" data-act="mboDel" data-id="${m.id}">MBOを削除</button>
      </div>
      <div class="muted" style="margin-bottom:4px">主な成果指標（1行に1つ）</div>
      <textarea data-save="krs" data-kind="mbo" data-id="${m.id}">${esc((m.krs||[]).join('\n'))}</textarea>
      <div class="bar" style="margin:10px 0">
        <span class="muted">進捗</span>
        <input type="range" min="0" max="100" step="5" value="${m.progress||0}" data-chg="progress" data-id="${m.id}" class="grow">
        <strong>${m.progress||0}%</strong>
      </div>
      <div class="muted" style="margin-bottom:4px">自己評価・メモ</div>
      <textarea data-save="review" data-kind="mbo" data-id="${m.id}">${esc(m.review)}</textarea>
      <h2 style="margin-top:14px">マイルストーン（${ms.length}）</h2>
      ${ms.map(x => `<div class="item"><div class="bar">
        <input type="text" class="grow" value="${esc(x.title)}" data-save="title" data-kind="ms" data-id="${x.id}">
        <input type="date" value="${x.due||''}" data-save="due" data-kind="ms" data-id="${x.id}">
        <select data-chg="mstatus" data-id="${x.id}">${MS_STATUS.map(s => `<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select>
        <button class="ghost danger" data-act="msDel" data-id="${x.id}">×</button>
      </div></div>`).join('')}
      <form data-form="ms" data-id="${m.id}" class="bar" style="margin-top:8px">
        <input type="text" name="title" class="grow" placeholder="マイルストーン名" required>
        <input type="date" name="due">
        <button>追加</button>
      </form>
    </div>`;
  };
  document.getElementById('v-mbo').innerHTML = `
    ${halves.length ? halves.map(h => `<div class="half">${esc(h)}</div>` +
        S.mbos.filter(m => m.half === h).map(mboCard).join('')).join('') : '<p class="muted">MBOはまだありません</p>'}
    <div class="card" style="margin-top:14px"><h2>MBOを追加</h2>
      <form data-form="mbo" class="bar">
        <input type="text" name="half" value="${curHalf()}" style="width:9em">
        <input type="text" name="objective" class="grow" placeholder="目標（例：新サービスの立ち上げ）" required>
        <button class="primary">追加</button>
      </form>
    </div>`;
}

/* ---------- 週報 ---------- */
function reportData(){
  const ws = UI.week, we = addDays(ws,6), nws = addDays(ws,7), nwe = addDays(ws,13);
  const done = S.todos.filter(t => t.done && inR(t.doneAt, ws, we));
  const carry = S.todos.filter(t => !t.done && (inR(dayOf(t), ws, we) || (t.due && t.due <= we)));
  const next = S.todos.filter(t => !t.done && inR(dayOf(t), nws, nwe)).sort((a,b) => a.slot < b.slot ? -1 : 1);
  const hours = {};
  done.forEach(t => { const k = t.milestoneId || ''; hours[k] = (hours[k]||0) + (+t.actualMin || +t.estMin || 0); });
  const lim = addDays(we,14);
  const dueMs = S.milestones.filter(m => m.status !== '達成' && m.due && m.due <= lim)
    .sort((a,b) => a.due < b.due ? -1 : 1);
  const mbos = S.mbos.filter(m => m.half === curHalf());
  return { ws, we, nws, nwe, done, carry, next, hours, dueMs, mbos };
}
function reportText(d){
  const L = [];
  const mName = k => k ? (msName(k) || '(削除済み)') : 'マイルストーン未設定';
  L.push(`# 週報 ${dlabel(d.ws)}〜${dlabel(d.we)}`, '');
  L.push(`## 完了（${d.done.length}件）`);
  d.done.forEach(t => L.push(`- ${t.title}${t.milestoneId ? `（${msName(t.milestoneId)}）` : ''} ${fmtMin(t.actualMin || t.estMin)}`));
  if (!d.done.length) L.push('- なし');
  L.push('', '## 時間の使い方');
  const hk = Object.keys(d.hours);
  hk.forEach(k => L.push(`- ${mName(k)}: ${fmtMin(d.hours[k])}`));
  if (!hk.length) L.push('- なし');
  L.push('', '## MBO進捗（今期）');
  d.mbos.forEach(m => L.push(`- ${m.objective}: ${m.progress||0}%`));
  if (!d.mbos.length) L.push('- なし');
  L.push('', '## マイルストーン（期限14日以内・未達成）');
  d.dueMs.forEach(m => L.push(`- [${m.status}] ${m.title}（期限 ${m.due}）`));
  if (!d.dueMs.length) L.push('- なし');
  L.push('', '## 持ち越し・未完了');
  d.carry.forEach(t => L.push(`- ${t.title}${t.reason ? `（理由：${t.reason}）` : ''}`));
  if (!d.carry.length) L.push('- なし');
  L.push('', '## 来週の予定');
  d.next.forEach(t => L.push(`- ${slotLabel(t.slot)}: ${t.title}（${fmtMin(t.estMin)}）`));
  if (!d.next.length) L.push('- 未割当');
  L.push('', '## 所感');
  L.push(S.reports[d.ws]?.reflection || '');
  return L.join('\n');
}
function renderReport(){
  const d = reportData(), txt = reportText(d);
  const list = arr => arr.length ? arr.join('') : '<p class="muted">なし</p>';
  document.getElementById('v-report').innerHTML = `
    <div class="card"><div class="hd">
      <div class="bar">
        <button data-act="wk" data-n="-7">◀ 前週</button>
        <button data-act="wk" data-n="0">今週</button>
        <button data-act="wk" data-n="7">次週 ▶</button>
      </div>
      <strong>${dlabel(d.ws)} 〜 ${dlabel(d.we)}</strong>
    </div></div>
    <div class="card"><h2>完了（${d.done.length}件）</h2>
      ${list(d.done.map(t => `<div class="item">${esc(t.title)} <span class="muted">${t.milestoneId ? esc(msName(t.milestoneId)) + ' · ' : ''}${fmtMin(t.actualMin || t.estMin)}</span></div>`))}
    </div>
    <div class="card"><h2>時間の使い方</h2>
      ${list(Object.keys(d.hours).map(k => `<div class="item">${esc(k ? msName(k) || '(削除済み)' : 'マイルストーン未設定')}：${fmtMin(d.hours[k])}</div>`))}
    </div>
    <div class="card"><h2>マイルストーン（期限14日以内）</h2>
      ${list(d.dueMs.map(m => `<div class="item">[${esc(m.status)}] ${esc(m.title)} <span class="muted">期限 ${m.due}</span></div>`))}
    </div>
    <div class="card"><h2>持ち越し・未完了（理由を選ぶと週報に反映されます）</h2>
      ${list(d.carry.map(t => `<div class="item">${esc(t.title)}
        <div class="meta"><select data-chg="reason" data-id="${t.id}">
          <option value="">理由を選択</option>
          ${REASONS.map(r => `<option${r===t.reason?' selected':''}>${r}</option>`).join('')}
        </select></div></div>`))}
    </div>
    <div class="card"><h2>来週の予定</h2>
      ${list(d.next.map(t => `<div class="item">${slotLabel(t.slot)}：${esc(t.title)} <span class="muted">${fmtMin(t.estMin)}</span></div>`))}
    </div>
    <div class="card"><h2>所感</h2>
      <textarea data-save="reflection" data-kind="report" data-id="${d.ws}">${esc(S.reports[d.ws]?.reflection || '')}</textarea>
    </div>
    <div class="card"><h2>出力用テキスト</h2>
      <div class="bar" style="margin-bottom:8px">
        <button class="primary" data-act="copy">コピー</button>
        <button data-act="dlmd">Markdownで保存</button>
      </div>
      <pre id="rtxt">${esc(txt)}</pre>
    </div>`;
}

/* ---------- 描画 ---------- */
function render(){
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === UI.tab));
  document.querySelectorAll('[data-view]').forEach(s => s.hidden = s.dataset.view !== UI.tab);
  ({ week:renderWeek, todo:renderTodo, mbo:renderMbo, report:renderReport })[UI.tab]();
}

/* ---------- 書き出し・コピー ---------- */
function download(name, type, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(){
  const t = document.getElementById('rtxt').textContent;
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  alert('コピーしました');
}
function importFile(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!Array.isArray(j.todos) || !Array.isArray(j.mbos) || !Array.isArray(j.milestones)) throw new Error('format');
      if (!confirm('現在のデータを読み込んだ内容で置き換えます。よろしいですか？')) return;
      S = { mbos:j.mbos, milestones:j.milestones, todos:j.todos, reports:j.reports || {} };
      save(); render();
    } catch(e){ alert('読み込めませんでした。書き出したJSONファイルを選んでください。'); }
  };
  r.readAsText(file);
}

/* ---------- イベント ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){ UI.tab = tab.dataset.tab; render(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act){
    case 'wk':
      UI.week = b.dataset.n === '0' ? monday(today()) : addDays(UI.week, +b.dataset.n);
      render(); break;
    case 'toggle': {
      const t = S.todos.find(x => x.id === id); if (!t) break;
      t.done = b.checked;
      if (t.done){ t.doneAt = today(); if (t.actualMin == null) t.actualMin = t.estMin; }
      else { t.doneAt = null; }
      save(); render(); break;
    }
    case 'del':
      if (confirm('このタスクを削除しますか？')){ S.todos = S.todos.filter(x => x.id !== id); save(); render(); }
      break;
    case 'mboDel': {
      if (!confirm('このMBOを削除しますか？（紐づくマイルストーンも削除されます）')) break;
      const mids = S.milestones.filter(x => x.mboId === id).map(x => x.id);
      S.todos.forEach(t => { if (mids.includes(t.milestoneId)) t.milestoneId = null; });
      S.milestones = S.milestones.filter(x => x.mboId !== id);
      S.mbos = S.mbos.filter(x => x.id !== id);
      save(); render(); break;
    }
    case 'msDel':
      if (confirm('このマイルストーンを削除しますか？')){
        S.todos.forEach(t => { if (t.milestoneId === id) t.milestoneId = null; });
        S.milestones = S.milestones.filter(x => x.id !== id);
        save(); render();
      }
      break;
    case 'export':
      download(`task-backup-${today()}.json`, 'application/json', JSON.stringify(S, null, 2)); break;
    case 'import':
      document.getElementById('imp').click(); break;
    case 'copy': copyText(); break;
    case 'dlmd':
      download(`週報-${UI.week}.md`, 'text/markdown', document.getElementById('rtxt').textContent); break;
  }
});

// テキスト欄（フォーカスを外したときに保存。再描画はしない）
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'imp'){ importFile(el.files[0]); el.value = ''; return; }

  if (el.dataset.save){
    const f = el.dataset.save, id = el.dataset.id, kind = el.dataset.kind || 'todo';
    const v = el.value;
    if (kind === 'report'){
      S.reports[id] = { ...(S.reports[id] || {}), reflection: v };
      save();
      document.getElementById('rtxt').textContent = reportText(reportData());
      return;
    }
    const list = kind === 'mbo' ? S.mbos : kind === 'ms' ? S.milestones : S.todos;
    const o = list.find(x => x.id === id); if (!o) return;
    if (f === 'actual') o.actualMin = v === '' ? null : +v;
    else if (f === 'krs') o.krs = v.split('\n').map(s => s.trim()).filter(Boolean);
    else if (f === 'due') o.due = v || null;
    else if (f === 'title'){ if (v.trim()) o.title = v.trim(); else { el.value = o.title; return; } }
    else if (f === 'objective'){ if (v.trim()) o.objective = v.trim(); else { el.value = o.objective; return; } }
    else o[f] = v.trim();
    save();
    return;
  }

  const c = el.dataset.chg;
  if (!c) return;
  if (c === 'filter'){ UI.filter = el.value; render(); return; }
  const id = el.dataset.id;
  const t = S.todos.find(x => x.id === id);
  const m = S.milestones.find(x => x.id === id);
  const b = S.mbos.find(x => x.id === id);
  switch (c){
    case 'slot':    if (t) t.slot = el.value; break;
    case 'est':     if (t) t.estMin = +el.value; break;
    case 'ms':      if (t) t.milestoneId = el.value || null; break;
    case 'reason':  if (t) t.reason = el.value; break;
    case 'mstatus': if (m) m.status = el.value; break;
    case 'progress':if (b) b.progress = +el.value; break;
  }
  save(); render();
});

document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  const fd = new FormData(f);
  const title = (fd.get('title') || fd.get('objective') || '').trim();
  if (kind === 'todo'){
    if (!title) return;
    S.todos.push({ id:nid(), title, role:(fd.get('role')||'').trim(), milestoneId:fd.get('ms')||null,
      estMin:+fd.get('est'), due:fd.get('due')||null, done:false, doneAt:null, actualMin:null, slot:'', reason:'' });
  } else if (kind === 'mbo'){
    if (!title) return;
    S.mbos.push({ id:nid(), half:(fd.get('half')||curHalf()).trim(), objective:title, krs:[], progress:0, review:'' });
  } else if (kind === 'ms'){
    if (!title) return;
    S.milestones.push({ id:nid(), mboId:f.dataset.id, title, due:fd.get('due')||null, status:'未着手' });
  }
  save(); render();
});

load();
render();
</script>
